<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>热与功 · 对比演示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0e1a;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif;
            padding: 20px;
        }

        .main-container {
            max-width: 1060px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* ---- 卡片容器 ---- */
        .card {
            background: radial-gradient(ellipse at 50% 30%, #151e33, #090c16);
            border-radius: 28px;
            padding: 22px 28px 18px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.04) inset;
            width: 100%;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 8px 16px;
        }

        .card-title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .card-title.hot {
            background: linear-gradient(135deg, #f6a87e, #f0b87e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .card-title.work {
            background: linear-gradient(135deg, #5fc8ff, #1a7bc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .card-subtitle {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.35);
            background: rgba(255, 255, 255, 0.04);
            padding: 3px 14px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .legend-row {
            display: flex;
            gap: 18px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.55);
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .legend-dot.hot { background: radial-gradient(circle at 30% 30%, #ff4d1a, #b32a00); }
        .legend-dot.cold { background: radial-gradient(circle at 30% 30%, #4da6ff, #0066cc); }
        .legend-dot.mid { background: radial-gradient(circle at 30% 30%, #ffcc66, #cc9900); }
        .legend-dot.work { background: radial-gradient(circle at 30% 30%, #5fc8ff, #1a7bc4); }

        .canvas-wrapper {
            border-radius: 14px;
            overflow: hidden;
            background: #060a14;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.04) inset;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            background: transparent;
        }

        .card-footer {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 12px;
            flex-wrap: wrap;
            gap: 8px 18px;
        }

        .card-footer-text {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.45);
            line-height: 1.5;
            text-align: center;
            letter-spacing: 0.3px;
        }

        .card-footer-text strong {
            color: rgba(255, 255, 255, 0.7);
        }

        .badge {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.03);
            padding: 3px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            white-space: nowrap;
        }

        /* ---- 响应式 ---- */
        @media (max-width: 700px) {
            .main-container { gap: 16px; }
            .card { padding: 14px 14px 12px; border-radius: 20px; }
            .card-title { font-size: 18px; }
            .card-subtitle { font-size: 11px; padding: 2px 10px; }
            .legend-row { font-size: 11px; gap: 12px; }
            .card-footer-text { font-size: 12px; }
            .badge { font-size: 10px; padding: 2px 10px; }
        }

        @media (max-width: 480px) {
            .card-title { font-size: 16px; }
            .legend-item { gap: 4px; }
            .legend-dot { width: 10px; height: 10px; }
        }
    </style>
</head>
<body>

<div class="main-container">

    <!-- ==================== 热 ==================== -->
    <div class="card">
        <div class="card-header">
            <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
                <span class="card-title hot">🔥 热 · 无序运动</span>
                <span class="card-subtitle">高温 → 低温 · 能量传递</span>
            </div>
            <div class="legend-row">
                <span class="legend-item"><span class="legend-dot hot"></span> 高温 (快)</span>
                <span class="legend-item"><span class="legend-dot mid"></span> 中温</span>
                <span class="legend-item"><span class="legend-dot cold"></span> 低温 (慢)</span>
            </div>
        </div>

        <div class="canvas-wrapper">
            <canvas id="canvasHot" width="960" height="480"></canvas>
        </div>

        <div class="card-footer">
            <span class="card-footer-text">
                <strong>热</strong> 是大量质点以 <strong style="color:#f08a5a;">无序</strong> 运动方式传递的能量 · 
                快分子变慢，慢分子变快，趋于 <strong style="color:#7fd47f;">热平衡</strong>
            </span>
            <span class="badge">⚡ 无物质迁移</span>
        </div>
    </div>

    <!-- ==================== 功 ==================== -->
    <div class="card">
        <div class="card-header">
            <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
                <span class="card-title work">⚙️ 功 · 有序运动</span>
                <span class="card-subtitle">所有质点同步平移</span>
            </div>
            <div class="legend-row">
                <span class="legend-item"><span class="legend-dot work"></span> 有序 · 同向同距</span>
            </div>
        </div>

        <div class="canvas-wrapper">
            <canvas id="canvasWork" width="960" height="360"></canvas>
        </div>

        <div class="card-footer">
            <span class="card-footer-text">
                <strong>功</strong> 是大量质点以 <strong style="color:#5fc8ff;">有序</strong> 运动方式传递的能量 · 
                每个分子向右平移 <strong style="color:#5fc8ff;">相同距离</strong>
            </span>
            <span class="badge">➡️ 整齐划一</span>
        </div>
    </div>

</div>

<!-- ========================================================== -->
<!-- 热 的脚本 -->
<script>
    (function() {
        const canvas = document.getElementById('canvasHot');
        const ctx = canvas.getContext('2d');
        const W = 960, H = 480;

        // ---- 区域划分 ----
        const regions = [
            { id: 'A', x: 20, y: 30, w: 280, h: 420, label: '高温', color: '#ff6a33' },
            { id: 'B', x: 330, y: 30, w: 280, h: 420, label: '低温', color: '#5fc8ff' },
            { id: 'C', x: 640, y: 30, w: 280, h: 420, label: '能量传递后', color: '#7fd47f' }
        ];

        const PARTICLES_PER_REGION = 32;
        const MIN_RADIUS = 4, MAX_RADIUS = 9;

        const SPEED_RANGES = {
            A: { min: 3.2, max: 5.6 },
            B: { min: 0.1, max: 0.5 },
            C: { min: 0.8, max: 1.8 }
        };

        const HUE_OFFSET = { A: 0, B: 210, C: 120 };

        function rand(min, max) { return Math.random() * (max - min) + min; }
        function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

        class Particle {
            constructor(x, y, vx, vy, radius, speed, regionId) {
                this.x = x; this.y = y; this.vx = vx; this.vy = vy;
                this.radius = radius; this.speed = speed;
                this.regionId = regionId;
                this.hue = HUE_OFFSET[regionId] || 0;
                this.light = 55;
            }
            update(region) {
                this.x += this.vx; this.y += this.vy;
                const pad = this.radius + 2;
                const left = region.x + pad, right = region.x + region.w - pad;
                const top = region.y + pad, bottom = region.y + region.h - pad;
                if (this.x < left) { this.x = left; this.vx = -this.vx; }
                if (this.x > right) { this.x = right; this.vx = -this.vx; }
                if (this.y < top) { this.y = top; this.vy = -this.vy; }
                if (this.y > bottom) { this.y = bottom; this.vy = -this.vy; }
                this.speed = Math.hypot(this.vx, this.vy);
                const speedNorm = clamp(this.speed / 6.0, 0, 1);
                const hueShift = (speedNorm - 0.5) * 20;
                this.hue = (HUE_OFFSET[this.regionId] + hueShift + 360) % 360;
            }
            draw(ctx) {
                const glow = this.radius * 2.6;
                const grad = ctx.createRadialGradient(
                    this.x, this.y, this.radius * 0.2,
                    this.x, this.y, glow
                );
                const alpha = 0.85, light = this.light + 12;
                grad.addColorStop(0, `hsla(${this.hue}, 80%, ${light}%, ${alpha})`);
                grad.addColorStop(0.5, `hsla(${this.hue}, 75%, ${this.light}%, ${alpha * 0.5})`);
                grad.addColorStop(1, `hsla(${this.hue}, 70%, ${this.light - 20}%, 0)`);
                ctx.beginPath();
                ctx.arc(this.x, this.y, glow, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();

                const coreGrad = ctx.createRadialGradient(
                    this.x - this.radius * 0.3, this.y - this.radius * 0.3, this.radius * 0.1,
                    this.x, this.y, this.radius
                );
                coreGrad.addColorStop(0, `hsla(${this.hue + 10}, 90%, ${this.light + 25}%, 1)`);
                coreGrad.addColorStop(0.7, `hsla(${this.hue}, 80%, ${this.light + 5}%, 1)`);
                coreGrad.addColorStop(1, `hsla(${this.hue - 10}, 70%, ${this.light - 10}%, 1)`);
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = coreGrad;
                ctx.fill();

                ctx.beginPath();
                ctx.arc(this.x - this.radius * 0.25, this.y - this.radius * 0.3, this.radius * 0.2, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(0, 0%, 100%, 0.5)`;
                ctx.fill();
            }
        }

        let particles = [];
        function initParticles() {
            particles = [];
            for (const region of regions) {
                const speedRange = SPEED_RANGES[region.id];
                for (let i = 0; i < PARTICLES_PER_REGION; i++) {
                    let x, y, overlap; let attempts = 0;
                    do {
                        x = rand(region.x + 12, region.x + region.w - 12);
                        y = rand(region.y + 12, region.y + region.h - 12);
                        overlap = false;
                        for (const p of particles) {
                            if (p.regionId === region.id && Math.hypot(p.x - x, p.y - y) < (MAX_RADIUS * 2 + 4)) {
                                overlap = true; break;
                            }
                        }
                        attempts++;
                    } while (overlap && attempts < 30);
                    const speed = rand(speedRange.min, speedRange.max);
                    const angle = rand(0, 2 * Math.PI);
                    const vx = Math.cos(angle) * speed;
                    const vy = Math.sin(angle) * speed;
                    const radius = rand(MIN_RADIUS, MAX_RADIUS);
                    particles.push(new Particle(x, y, vx, vy, radius, speed, region.id));
                }
            }
        }
        initParticles();

        function drawRegions() {
            for (const region of regions) {
                ctx.fillStyle = 'rgba(255,255,255,0.02)';
                ctx.fillRect(region.x, region.y, region.w, region.h);
                ctx.strokeStyle = 'rgba(255,255,255,0.08)';
                ctx.lineWidth = 1;
                ctx.strokeRect(region.x, region.y, region.w, region.h);
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.font = 'bold 20px "Segoe UI", "PingFang SC", sans-serif';
                ctx.fillStyle = region.color + 'dd';
                ctx.fillText(region.label, region.x + region.w/2, region.y + 10);
            }
        }

        function animateHot() {
            for (const p of particles) {
                const region = regions.find(r => r.id === p.regionId);
                if (region) p.update(region);
            }
            ctx.fillStyle = '#060a14';
            ctx.fillRect(0, 0, W, H);
            drawRegions();
            for (const p of particles) p.draw(ctx);
            requestAnimationFrame(animateHot);
        }
        animateHot();

        function resizeHot() {
            const wrapper = canvas.parentElement;
            const w = wrapper.clientWidth;
            const aspect = 960 / 480;
            let dw = w, dh = w / aspect;
            const maxH = window.innerHeight * 0.45;
            if (dh > maxH) { dh = maxH; dw = maxH * aspect; }
            canvas.style.width = dw + 'px';
            canvas.style.height = dh + 'px';
        }
        window.addEventListener('resize', resizeHot);
        setTimeout(resizeHot, 20);
        resizeHot();
    })();
</script>

<!-- ========================================================== -->
<!-- 功 的脚本 -->
<script>
    (function() {
        const canvas = document.getElementById('canvasWork');
        const ctx = canvas.getContext('2d');
        const W = 960, H = 360;

        const COLS = 10, ROWS = 4;
        const SPACING = 62;
        const RADIUS = 14;
        const START_X = 50, START_Y = 60;
        const TOTAL_WIDTH = (COLS - 1) * SPACING;

        const molecules = [];
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                molecules.push({ baseX: START_X + c * SPACING, baseY: START_Y + r * SPACING });
            }
        }

        const SPEED = 2.0;
        let offsetX = 0;
        const MAX_OFFSET = 420;

        function drawWork() {
            ctx.fillStyle = '#060a14';
            ctx.fillRect(0, 0, W, H);

            // 画网格连线 (体现有序)
            ctx.strokeStyle = 'rgba(100, 200, 255, 0.05)';
            ctx.lineWidth = 1;
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const idx = r * COLS + c;
                    const mol = molecules[idx];
                    const x = mol.baseX + offsetX;
                    const y = mol.baseY;
                    if (c < COLS - 1) {
                        const next = molecules[r * COLS + c + 1];
                        const nx = next.baseX + offsetX;
                        ctx.beginPath();
                        ctx.moveTo(x, y);
                        ctx.lineTo(nx, y);
                        ctx.stroke();
                    }
                    if (r < ROWS - 1) {
                        const next = molecules[(r + 1) * COLS + c];
                        const ny = next.baseY;
                        ctx.beginPath();
                        ctx.moveTo(x, y);
                        ctx.lineTo(x, ny);
                        ctx.stroke();
                    }
                }
            }

            // 画分子
            for (const mol of molecules) {
                const x = mol.baseX + offsetX;
                const y = mol.baseY;
                const glow = RADIUS * 2.5;
                const grad = ctx.createRadialGradient(x, y, RADIUS * 0.2, x, y, glow);
                grad.addColorStop(0, 'rgba(80, 200, 255, 1)');
                grad.addColorStop(0.4, 'rgba(40, 160, 255, 0.8)');
                grad.addColorStop(1, 'rgba(20, 100, 200, 0)');
                ctx.beginPath();
                ctx.arc(x, y, glow, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();

                const coreGrad = ctx.createRadialGradient(
                    x - RADIUS * 0.3, y - RADIUS * 0.3, RADIUS * 0.1,
                    x, y, RADIUS
                );
                coreGrad.addColorStop(0, '#88ddff');
                coreGrad.addColorStop(0.7, '#3a9eff');
                coreGrad.addColorStop(1, '#1a6bc4');
                ctx.beginPath();
                ctx.arc(x, y, RADIUS, 0, Math.PI * 2);
                ctx.fillStyle = coreGrad;
                ctx.fill();

                ctx.beginPath();
                ctx.arc(x - RADIUS * 0.25, y - RADIUS * 0.3, RADIUS * 0.2, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.6)';
                ctx.fill();

                // 小箭头
                const arrowLen = RADIUS * 0.8;
                ctx.beginPath();
                ctx.moveTo(x + RADIUS * 0.2, y);
                ctx.lineTo(x + RADIUS * 0.2 + arrowLen, y);
                ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(x + RADIUS * 0.2 + arrowLen, y);
                ctx.lineTo(x + RADIUS * 0.2 + arrowLen - 6, y - 4);
                ctx.moveTo(x + RADIUS * 0.2 + arrowLen, y);
                ctx.lineTo(x + RADIUS * 0.2 + arrowLen - 6, y + 4);
                ctx.stroke();
            }

            // 大箭头
            const arrowY = H - 28;
            const arrowStart = 80, arrowEnd = W - 80;
            ctx.strokeStyle = 'rgba(100, 200, 255, 0.25)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(arrowStart, arrowY);
            ctx.lineTo(arrowEnd, arrowY);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(arrowEnd, arrowY);
            ctx.lineTo(arrowEnd - 15, arrowY - 6);
            ctx.moveTo(arrowEnd, arrowY);
            ctx.lineTo(arrowEnd - 15, arrowY + 6);
            ctx.stroke();

            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            ctx.font = '15px "Segoe UI", "PingFang SC", sans-serif';
            ctx.fillStyle = 'rgba(100, 200, 255, 0.3)';
            ctx.fillText('所有分子同步向右平移 · 相同位移', W/2, arrowY - 6);

            ctx.textAlign = 'right';
            ctx.textBaseline = 'top';
            ctx.font = '13px monospace';
            ctx.fillStyle = 'rgba(255,255,255,0.15)';
            ctx.fillText(`位移: ${offsetX.toFixed(1)} px`, W - 18, 12);
        }

        function updateWork() {
            offsetX += SPEED;
            if (offsetX > MAX_OFFSET) offsetX = 0;
        }

        function animateWork() {
            updateWork();
            drawWork();
            requestAnimationFrame(animateWork);
        }
        animateWork();

        function resizeWork() {
            const wrapper = canvas.parentElement;
            const w = wrapper.clientWidth;
            const aspect = 960 / 360;
            let dw = w, dh = w / aspect;
            const maxH = window.innerHeight * 0.35;
            if (dh > maxH) { dh = maxH; dw = maxH * aspect; }
            canvas.style.width = dw + 'px';
            canvas.style.height = dh + 'px';
        }
        window.addEventListener('resize', resizeWork);
        setTimeout(resizeWork, 20);
        resizeWork();
    })();
</script>

</body>
</html>
